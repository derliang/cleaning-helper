# GitHub Pages 發布：只上傳「白名單」內的網站檔案，內部文件（CLAUDE.md、TODO.md、docs、tests 等）不會上線。
# 新增網站需要的檔案時，必須同步加進下方「Stage site files」的清單，否則線上會缺檔（規範：teacher-hub docs/PUBLISHING.md 第 6 節）。
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html license.html LICENSE.md LICENSE-MIT-legacy _site/
          touch _site/.nojekyll
      - name: Check local references exist
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = '_site'
          bad = []
          for f in os.listdir(root):
              if not f.endswith('.html'):
                  continue
              text = open(os.path.join(root, f), encoding='utf-8').read()
              for m in re.finditer(r'''(?:src|href)=["']([^"'#?${}]+)["']''', text):
                  u = m.group(1)
                  if re.match(r'^(https?:|//|data:|mailto:|javascript:)', u):
                      continue
                  if not os.path.exists(os.path.join(root, u)):
                      bad.append((f, u))
          print('missing:', bad)
          sys.exit(1 if bad else 0)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
