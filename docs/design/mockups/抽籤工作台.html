<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掃地工作小幫手 抽籤工作台模擬頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   掃地工作小幫手 · Design Tokens
   概念：紙本點名簿（淺色）與教室黑板（深色）。
   暖調紙色底、墨綠主色、琥珀只用在「辛苦／進行中」。
   全部用 hex：html2canvas 無法解析 oklch，匯出圖片會壞。
   ============================================================ */
:root {
  --font: 'Noto Sans TC', system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;

  /* 表面與線條 */
  --bg: #F5F4EF;
  --surface: #FDFCF9;
  --surface-2: #EEEDE6;
  --surface-3: #E3E2D8;
  --line: #E2E0D5;
  --line-strong: #CBC8BA;

  /* 文字（text-3 只用在 bg / surface / surface-2 上，對比 ≥ 4.9） */
  --text: #1B2623;
  --text-2: #43504B;
  --text-3: #5C6863;

  /* 主色：墨綠 */
  --primary: #0F766E;
  --primary-hover: #0B5F59;
  --primary-ink: #0A4F4A;
  --primary-soft: #DDF0EC;
  --primary-line: #A9D6CE;
  --on-primary: #FFFFFF;

  /* 強調：琥珀（辛苦的工作、抽籤進行中） */
  --accent: #B45309;
  --accent-ink: #7A3B06;
  --accent-soft: #FBEBCB;
  --accent-line: #E8C887;
  --ring: #E09A2E;
  --heavy-bg: #FFF6E2;
  --on-solid: #FFFFFF;

  /* 危險 */
  --danger: #BE123C;
  --danger-ink: #9F1239;
  --danger-soft: #FDE6EA;
  --danger-line: #F2B6C2;

  /* 工作類別 */
  --cat-classroom-bg: #E2F3E7; --cat-classroom-fg: #14612F; --cat-classroom-line: #B3DABE; --cat-classroom-solid: #1E7B43;
  --cat-duty-bg: #FAEDCB;      --cat-duty-fg: #7F4308;      --cat-duty-line: #E8CA87;      --cat-duty-solid: #A45C08;
  --cat-public-bg: #E7E8FA;    --cat-public-fg: #3C3CA0;    --cat-public-line: #C2C6EE;    --cat-public-solid: #4B4BC0;
  --cat-restroom-bg: #DCEEF9;  --cat-restroom-fg: #0A5782;  --cat-restroom-line: #B0D5EC;  --cat-restroom-solid: #1B76AB;
  --cat-other-bg: #EEEDE6;     --cat-other-fg: #43504B;     --cat-other-line: #CBC8BA;     --cat-other-solid: #5C6863;

  /* 形狀與陰影 */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px;
  --shadow-1: 0 1px 2px rgba(40, 36, 20, .07), 0 1px 1px rgba(40, 36, 20, .04);
  --shadow-2: 0 10px 28px -10px rgba(40, 36, 20, .28), 0 2px 6px rgba(40, 36, 20, .08);
  --scrim: rgba(27, 38, 35, .46);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1219; --surface: #141B25; --surface-2: #1B2431; --surface-3: #263244;
    --line: #222D3B; --line-strong: #34445A;
    --text: #E9EEF5; --text-2: #B7C2D1; --text-3: #8D9BB0;
    --primary: #38BBAA; --primary-hover: #55CDBE; --primary-ink: #8FE0D4; --primary-soft: #11282B; --primary-line: #1F5254; --on-primary: #03201C;
    --accent: #F2B84B; --accent-ink: #F6D08A; --accent-soft: #2B2415; --accent-line: #5C4720; --ring: #F2B84B; --heavy-bg: #1D1E1F; --on-solid: #0A1017;
    --danger: #FF8CA0; --danger-ink: #FFB3C0; --danger-soft: #2D1A22; --danger-line: #66303E;
    --cat-classroom-bg: #14291F; --cat-classroom-fg: #86D9A6; --cat-classroom-line: #24503A; --cat-classroom-solid: #38A868;
    --cat-duty-bg: #2A2415;      --cat-duty-fg: #F0C46E;      --cat-duty-line: #5C4720;      --cat-duty-solid: #D69324;
    --cat-public-bg: #1D2245;    --cat-public-fg: #AEB6FF;    --cat-public-line: #353C82;    --cat-public-solid: #6F78E6;
    --cat-restroom-bg: #12283E;  --cat-restroom-fg: #8FCBF5;  --cat-restroom-line: #20527C;  --cat-restroom-solid: #3B9AE0;
    --cat-other-bg: #1B2431;     --cat-other-fg: #B7C2D1;     --cat-other-line: #34445A;     --cat-other-solid: #8D9BB0;
    --shadow-1: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 14px 32px -10px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .4);
    --scrim: rgba(3, 6, 10, .68);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1219; --surface: #141B25; --surface-2: #1B2431; --surface-3: #263244;
  --line: #222D3B; --line-strong: #34445A;
  --text: #E9EEF5; --text-2: #B7C2D1; --text-3: #8D9BB0;
  --primary: #38BBAA; --primary-hover: #55CDBE; --primary-ink: #8FE0D4; --primary-soft: #11282B; --primary-line: #1F5254; --on-primary: #03201C;
  --accent: #F2B84B; --accent-ink: #F6D08A; --accent-soft: #2B2415; --accent-line: #5C4720; --ring: #F2B84B; --heavy-bg: #1D1E1F; --on-solid: #0A1017;
  --danger: #FF8CA0; --danger-ink: #FFB3C0; --danger-soft: #2D1A22; --danger-line: #66303E;
  --cat-classroom-bg: #14291F; --cat-classroom-fg: #86D9A6; --cat-classroom-line: #24503A; --cat-classroom-solid: #38A868;
  --cat-duty-bg: #2A2415;      --cat-duty-fg: #F0C46E;      --cat-duty-line: #5C4720;      --cat-duty-solid: #D69324;
  --cat-public-bg: #1D2245;    --cat-public-fg: #AEB6FF;    --cat-public-line: #353C82;    --cat-public-solid: #6F78E6;
  --cat-restroom-bg: #12283E;  --cat-restroom-fg: #8FCBF5;  --cat-restroom-line: #20527C;  --cat-restroom-solid: #3B9AE0;
  --cat-other-bg: #1B2431;     --cat-other-fg: #B7C2D1;     --cat-other-line: #34445A;     --cat-other-solid: #8D9BB0;
  --shadow-1: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 14px 32px -10px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .4);
  --scrim: rgba(3, 6, 10, .68);
  color-scheme: dark;
}


/* ===== 預覽頁本身 ===== */
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.6;
  padding-block: 0 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 56px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.bar-title { font-weight: 700; font-size: 16px; margin-right: auto; }
.bar nav { display: flex; flex-wrap: wrap; gap: 4px; }
.bar a { color: var(--text-2); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 8px; }
.bar a:hover { background: var(--surface-2); color: var(--text); }
.themeseg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.themeseg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font: inherit; font-size: 13px; color: var(--text-2); cursor: pointer; }
.themeseg button[aria-pressed="true"] { background: var(--surface); color: var(--primary-ink); font-weight: 700; box-shadow: var(--shadow-1); }
.themeseg button:focus-visible, .bar a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.intro { padding-top: 40px; display: grid; gap: 28px; }
.intro h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.2; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.meta { color: var(--text-3); font-size: 13px; margin-top: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 28px; }
.cols h2, .sec h2 { font-size: 18px; margin: 0 0 10px; }
.cols ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.cols li { max-width: 62ch; }
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp th, .cmp td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmp th { color: var(--text-3); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.cmp td:first-child { font-weight: 700; white-space: nowrap; }
.scroll-x { overflow-x: auto; }
.sec { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 80px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.sec-id { font-size: 13px; font-weight: 700; color: var(--primary-ink); background: var(--primary-soft); border: 1px solid var(--primary-line); padding: 2px 10px; border-radius: 99px; }
.sec h2 { margin: 0; font-size: 22px; }
.sec p.lead { margin: 0; color: var(--text-2); max-width: 70ch; }
.group { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.dev { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.dev figcaption { font-size: 12px; font-weight: 700; color: var(--text-3); letter-spacing: .04em; }
.fitbox { position: relative; flex: none; }
.frame { position: absolute; top: 0; left: 0; transform-origin: 0 0; overflow: hidden; border-radius: 18px; border: 1px solid var(--line-strong); box-shadow: var(--shadow-2); container-type: inline-size; container-name: frame; background: var(--bg); }
.next { border-top: 1px solid var(--line); padding-top: 24px; display: grid; gap: 8px; }
.next code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: 13px; }

/* 元件與狀態展示板 */
.kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 16px; }
.kit .app { min-height: 0; background: transparent; }
.kit-card { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.kit-card h3 { margin: 0; font-size: 13px; letter-spacing: .06em; color: var(--text-3); font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.sw { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); font-size: 12px; }
.sw i { display: block; height: 38px; }
.sw span { display: block; padding: 6px 8px; color: var(--text-2); }
.sw b { display: block; color: var(--text); font-size: 12px; }
.type-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.type-line small { color: var(--text-3); font-size: 12px; white-space: nowrap; }

/* ============================================================
   掃地工作小幫手 · Components
   行動優先：基準是手機（390），@media (min-width) 往上加。
   觸控：手機與 iPad 的點擊區 ≥ 44px，桌機（≥1024）縮到 40 / 34。
   ============================================================ */
.app {
  --tap: 44px;
  --tap-sm: 44px;
  --pad: 16px;
  --tabbar-h: 64px;
  --dock-offset: 0px;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  min-height: var(--viewport-h, 100dvh);
  display: flex;
  flex-direction: column;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
.app *, .app *::before, .app *::after { box-sizing: border-box; }
.app button, .app input, .app select, .app textarea { font: inherit; color: inherit; }
.app button { cursor: pointer; }
.app :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app h1, .app h2, .app h3, .app p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 類別色 ---------- */
[data-cat] { --cat-bg: var(--cat-other-bg); --cat-fg: var(--cat-other-fg); --cat-line: var(--cat-other-line); --cat-solid: var(--cat-other-solid); }
[data-cat="classroom"] { --cat-bg: var(--cat-classroom-bg); --cat-fg: var(--cat-classroom-fg); --cat-line: var(--cat-classroom-line); --cat-solid: var(--cat-classroom-solid); }
[data-cat="duty"]      { --cat-bg: var(--cat-duty-bg);      --cat-fg: var(--cat-duty-fg);      --cat-line: var(--cat-duty-line);      --cat-solid: var(--cat-duty-solid); }
[data-cat="public"]    { --cat-bg: var(--cat-public-bg);    --cat-fg: var(--cat-public-fg);    --cat-line: var(--cat-public-line);    --cat-solid: var(--cat-public-solid); }
[data-cat="restroom"]  { --cat-bg: var(--cat-restroom-bg);  --cat-fg: var(--cat-restroom-fg);  --cat-line: var(--cat-restroom-line);  --cat-solid: var(--cat-restroom-solid); }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 0 16px;
  border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text);
  font-weight: 700; font-size: 14px; line-height: 1; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
.btn-accent:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn-soft { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary-ink); }
.btn-soft:hover { background: var(--primary-soft); border-color: var(--primary); }
.btn-danger { background: var(--danger-soft); border-color: var(--danger-line); color: var(--danger-ink); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-ghost.btn-danger { color: var(--danger-ink); }
.btn-ghost.btn-danger:hover { background: var(--danger-soft); }
.btn-lg { min-height: 56px; padding: 0 28px; font-size: 17px; border-radius: var(--r-lg); }
.btn-sm { min-height: var(--tap-sm); padding: 0 12px; font-size: 13px; border-radius: var(--r-sm); }
.btn-icon { width: var(--tap); padding: 0; font-size: 18px; flex: none; }
.btn-icon.btn-sm { width: var(--tap-sm); }
.btn-block { width: 100%; }

/* ---------- 表單 ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: 13px; font-weight: 700; color: var(--text-2); }
.hint { font-size: 12.5px; color: var(--text-3); }
.input, .select, .textarea {
  width: 100%; min-height: var(--tap); padding: 0 14px;
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); font-size: 16px; line-height: 1.4;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { padding: 12px 14px; resize: vertical; min-height: 112px; }
.input::placeholder, .textarea::placeholder { color: var(--text-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.select { appearance: none; padding-right: 38px; font-weight: 500;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
.input-row { display: flex; gap: 8px; }
.input-row .input { flex: 1; min-width: 0; }

.switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 48px; height: 28px; margin: 0;
  border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line-strong); cursor: pointer; transition: background .2s, border-color .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .2s; }
.switch:checked { background: var(--primary); border-color: var(--primary); }
.switch:checked::after { transform: translateX(20px); background: var(--on-primary); }
.switch:disabled { opacity: .45; }

.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); }
.seg button, .seg label { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.seg [aria-pressed="true"], .seg [aria-current="true"] { background: var(--surface); color: var(--primary-ink); font-weight: 700; box-shadow: var(--shadow-1); }
.seg-full { display: flex; width: 100%; }
.seg-full > * { flex: 1; }

/* ---------- 標籤 ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 700; line-height: 1.3; white-space: nowrap; }
.chip-ok { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary-ink); }
.chip-warn { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
.chip-info { background: var(--cat-restroom-bg); border-color: var(--cat-restroom-line); color: var(--cat-restroom-fg); }
.chip-danger { background: var(--danger-soft); border-color: var(--danger-line); color: var(--danger-ink); }
.dotmark { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.badge { display: inline-flex; align-items: center; min-height: 24px; padding: 1px 9px; border-radius: 8px; border: 1px solid var(--cat-line); background: var(--cat-bg); color: var(--cat-fg); font-size: 12px; font-weight: 700; white-space: nowrap; }

/* 座號名牌：左側座號、右側姓名 */
.tag { display: inline-flex; align-items: stretch; min-height: 34px; border-radius: 10px; overflow: hidden; border: 1px solid var(--primary-line); background: var(--primary-soft); color: var(--primary-ink); font-size: 14px; font-weight: 700; line-height: 1.2; }
.tag b { display: grid; place-items: center; min-width: 30px; padding: 0 7px; background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tag > span { display: flex; align-items: center; gap: 6px; padding: 0 11px; }
.tag i { font-style: normal; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--cat-public-solid); color: var(--on-solid); }
.tag-manual { background: var(--cat-public-bg); border-color: var(--cat-public-line); color: var(--cat-public-fg); }
.tag-manual b { background: var(--cat-public-solid); color: var(--on-solid); }
.tag-empty { background: transparent; border: 1.5px dashed var(--line-strong); color: var(--text-3); font-weight: 500; }
.tag-empty > span { padding: 0 12px; }
.tag-plain { background: var(--surface); border-color: var(--line-strong); color: var(--text); }
.tag-plain b { background: var(--surface-3); color: var(--text-2); }

/* ---------- 卡片 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.card-pad { padding: 16px; }
.card-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

/* ---------- 外框：頂部（方案 1a） ---------- */
.topnav { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topnav-inner { max-width: 1160px; margin-inline: auto; padding: 0 var(--pad); display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand acts" "tabs tabs"; align-items: center; column-gap: 12px; }
.topnav .brand { grid-area: brand; min-height: 60px; }
.topnav .topbar-actions { grid-area: acts; }
.topnav-tabs { grid-area: tabs; display: grid; grid-template-columns: repeat(5, 1fr); margin-inline: calc(var(--pad) * -1); border-top: 1px solid var(--line); }

      '<label class="check-row" style="justify-content:space-between"><span>🎉 抽籤完畢慶祝彩帶</span><input class="switch" type="checkbox"></label>' +
      '<div class="seg seg-full" role="group" aria-label="抽籤時長"><button type="button" aria-pressed="false">短 6 秒</button><button type="button" aria-pressed="true">中 12 秒</button><button type="button" aria-pressed="false">長 18 秒</button></div></div></div></div>' +
      '<div class="kit-card"><div class="app"><h3 style="margin-bottom:12px">工作卡片的三種狀態</h3><div style="display:grid;gap:12px">' + card(BOARD[5], { empty: true }) + card(BOARD[1]) + card(BOARD[6], { drawing: true }) + '</div></div></div>' +
      '<div class="kit-card"><div class="app"><h3 style="margin-bottom:12px">提示訊息</h3><div class="row"><span class="toast">✅ 已成功儲存「擦黑板」修改內容！</span></div></div></div>';
  }

  /* ---------- 組頁 ---------- */
  function effective() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  var DEV = { phone: [390, 844, '手機 390 × 844'], pad: [820, 1180, 'iPad 直向 820 × 1180'], desk: [1280, 800, '桌機 1280 × 800'] };
  function fig(kind, html, pal) {
    var d = DEV[kind];
    return '<figure class="dev"><figcaption>' + d[2] + '</figcaption><div class="fitbox" data-w="' + d[0] + '" data-h="' + d[1] + '"><div class="frame' + (pal ? ' ' + pal : '') + '" style="width:' + d[0] + 'px;height:' + d[1] + 'px;--viewport-h:' + d[1] + 'px">' + html + '</div></div></figure>';
  }
  function wide(html) { return html.replace('data-open-on-wide', 'open'); }
  function render() {
    var side = shellSide('draw', drawMain('side'));
    document.getElementById('g-1b').innerHTML = fig('desk', side) + fig('pad', side) + fig('phone', side);
    fit();
  }
  function fit() {
    document.querySelectorAll('.group').forEach(function (g) {
      var boxes = Array.prototype.slice.call(g.querySelectorAll('.fitbox'));
      var avail = g.clientWidth - 2, gap = 24;
      var sumW = boxes.reduce(function (a, b) { return a + (+b.dataset.w); }, 0);
      var s = Math.min(1, (avail - gap * (boxes.length - 1)) / sumW);
      var together = s >= 0.5;
      boxes.forEach(function (b) {
        var w = +b.dataset.w, h = +b.dataset.h;
        var sc = together ? s : Math.min(1, avail / w);
        b.style.width = Math.round(w * sc) + 'px'; b.style.height = Math.round(h * sc) + 'px';
        b.firstElementChild.style.transform = 'scale(' + sc + ')';
      });
    });
  }

  /* ---------- 預覽配色切換 ---------- */
  var root = document.documentElement;
  var btns = document.querySelectorAll('.themeseg button');
  function setTheme(v) {
    if (v === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', v);
    btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.set === v)); });
    render();
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { setTheme(b.dataset.set); }); });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  window.addEventListener('resize', fit);
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
