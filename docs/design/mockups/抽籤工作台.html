<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掃地工作小幫手 抽籤工作台模擬頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   掃地工作小幫手 · Design Tokens v3「點名表」
   概念：白紙黑字的點名表。只有一個強調色（藍），其餘全是灰階。
   用字大、對比高；顏色只用來表示「可以按」「目前選到」「危險」。
   全部用 hex：html2canvas 無法解析 oklch，匯出圖片會失敗。
   ============================================================ */
:root {
  --font: 'Noto Sans TC', system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;

  /* 表面與線條 */
  --bg: #F2F3F5;
  --surface: #FFFFFF;
  --surface-2: #ECEEF1;
  --surface-3: #DDE0E5;
  --line: #D3D7DD;
  --line-strong: #78818D;

  /* 文字（text-3 在 bg、surface、surface-2 上都 ≥ 5.4:1） */
  --text: #0F1318;
  --text-2: #333A43;
  --text-3: #4F5864;

  /* 強調：藍（主要按鈕、目前所在、焦點） */
  --primary: #1D4ED8;
  --primary-hover: #1A41B6;
  --primary-ink: #1B3A9B;
  --primary-soft: #E7EDFF;
  --primary-line: #A8BCF3;
  --on-primary: #FFFFFF;

  /* 危險（刪除、清除、重設） */
  --danger: #B42318;
  --danger-ink: #A11E14;
  --danger-soft: #FDEDEB;
  --danger-line: #E9A9A2;

  /* 反白：用在「辛苦」「指定」這類需要一眼看到、但不想再加顏色的標記 */
  --inverse: #0F1318;
  --on-inverse: #FFFFFF;

  /* 形狀與陰影 */
  --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
  --shadow-1: 0 1px 2px rgba(15, 19, 24, .06);
  --shadow-2: 0 12px 32px -12px rgba(15, 19, 24, .35), 0 2px 6px rgba(15, 19, 24, .1);
  --scrim: rgba(15, 19, 24, .55);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0C0E; --surface: #15171A; --surface-2: #1F2226; --surface-3: #2B2F35;
    --line: #2F343A; --line-strong: #7D8693;
    --text: #F5F6F8; --text-2: #CDD2D9; --text-3: #A8B0BB;
    --primary: #8DB5FF; --primary-hover: #B0CDFF; --primary-ink: #BBD2FF; --primary-soft: #17243F; --primary-line: #35538F; --on-primary: #08101F;
    --danger: #FF9C94; --danger-ink: #FFBDB7; --danger-soft: #331819; --danger-line: #7A3434;
    --inverse: #F5F6F8; --on-inverse: #0B0C0E;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 14px 34px -10px rgba(0, 0, 0, .75), 0 2px 6px rgba(0, 0, 0, .5);
    --scrim: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0C0E; --surface: #15171A; --surface-2: #1F2226; --surface-3: #2B2F35;
  --line: #2F343A; --line-strong: #7D8693;
  --text: #F5F6F8; --text-2: #CDD2D9; --text-3: #A8B0BB;
  --primary: #8DB5FF; --primary-hover: #B0CDFF; --primary-ink: #BBD2FF; --primary-soft: #17243F; --primary-line: #35538F; --on-primary: #08101F;
  --danger: #FF9C94; --danger-ink: #FFBDB7; --danger-soft: #331819; --danger-line: #7A3434;
  --inverse: #F5F6F8; --on-inverse: #0B0C0E;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 14px 34px -10px rgba(0, 0, 0, .75), 0 2px 6px rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .7);
  color-scheme: dark;
}


/* ===== 預覽頁本身 ===== */
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.65;
  padding-block: 0 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 56px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line-strong); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.bar-title { font-weight: 700; font-size: 17px; margin-right: auto; }
.bar nav { display: flex; flex-wrap: wrap; gap: 4px; }
.bar a { color: var(--text); text-decoration: none; font-size: 15px; font-weight: 500; padding: 8px 12px; border-radius: 8px; }
.bar a:hover { background: var(--surface-2); }
.themeseg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; }
.themeseg button { border: 0; background: none; padding: 8px 14px; border-radius: 8px; font: inherit; font-size: 15px; color: var(--text-2); cursor: pointer; }
.themeseg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 700; }
.themeseg button:focus-visible, .bar a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.intro { padding-top: 40px; display: grid; gap: 28px; }
.intro h1 { font-size: clamp(30px, 4vw, 42px); line-height: 1.2; margin: 0; text-wrap: balance; }
.meta { color: var(--text-2); font-size: 15px; margin: 8px 0 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 28px; }
.cols h2, .sec h2 { font-size: 20px; margin: 0 0 10px; }
.cols ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.cols li { max-width: 62ch; }
.cmp { width: 100%; border-collapse: collapse; font-size: 16px; }
.cmp th, .cmp td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line-strong); vertical-align: top; }
.cmp th { color: var(--text-2); font-size: 14px; font-weight: 700; }
.cmp td:first-child { font-weight: 700; white-space: nowrap; }
.scroll-x { overflow-x: auto; }
.sec { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 80px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.sec-id { font-size: 15px; font-weight: 700; color: var(--on-inverse); background: var(--inverse); padding: 2px 12px; border-radius: 99px; }
.sec h2 { margin: 0; font-size: 24px; }
.sec p.lead { margin: 0; color: var(--text-2); max-width: 70ch; }
.group { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.dev { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.dev figcaption { font-size: 14px; font-weight: 700; color: var(--text-2); }
.fitbox { position: relative; flex: none; }
.frame { position: absolute; top: 0; left: 0; transform-origin: 0 0; overflow: hidden; border-radius: 18px; border: 1.5px solid var(--line-strong); box-shadow: var(--shadow-2); container-type: inline-size; container-name: frame; background: var(--bg); }
.next { border-top: 1px solid var(--line-strong); padding-top: 24px; display: grid; gap: 10px; }
.next code { background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 8px; font-size: 15px; }
.kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.kit .app { min-height: 0; background: transparent; }
.kit-card { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.kit-card h3 { margin: 0; font-size: 15px; color: var(--text-2); font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.sw { border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: var(--surface); font-size: 14px; }
.sw i { display: block; height: 40px; border-bottom: 1px solid var(--line); }
.sw span { display: block; padding: 6px 8px; color: var(--text-2); }
.sw b { display: block; color: var(--text); font-size: 14px; }
.type-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.type-line small { color: var(--text-2); font-size: 14px; white-space: nowrap; }

/* ============================================================
   掃地工作小幫手 · Components v3「點名表」
   行動優先：基準是手機（390），@media (min-width) 往上加。
   點擊區：手機與 iPad 48px，桌機（≥1024）44 / 36。最小字級 14px。
   注意：重設規則一律用 :where()（優先序 0），否則會蓋掉 .btn-* 的文字色。
   ============================================================ */
.app {
  --tap: 48px;
  --tap-sm: 48px;
  --pad: 16px;
  --tabbar-h: 68px;
  --dock-offset: 0px;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  min-height: var(--viewport-h, 100dvh);
  display: flex;
  flex-direction: column;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
.app *, .app *::before, .app *::after { box-sizing: border-box; }
:where(.app) button, :where(.app) input, :where(.app) select, :where(.app) textarea { font: inherit; color: inherit; }
:where(.app) button { cursor: pointer; }
:where(.app) h1, :where(.app) h2, :where(.app) h3, :where(.app) p { margin: 0; }
.app :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.app small { font-size: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 0 18px;
  border-radius: var(--r-md); border: 1.5px solid var(--line-strong);
  background: var(--surface); color: var(--text);
  font-weight: 700; font-size: 16px; line-height: 1.2; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-soft { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary-ink); }
.btn-soft:hover { background: var(--primary-soft); border-color: var(--primary); }
.btn-danger { background: var(--surface); border-color: var(--danger-line); color: var(--danger-ink); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-ghost.btn-danger { color: var(--danger-ink); }
.btn-ghost.btn-danger:hover { background: var(--danger-soft); }
.btn-lg { min-height: 56px; padding: 0 28px; font-size: 18px; border-radius: var(--r-lg); }
.btn-sm { min-height: var(--tap-sm); padding: 0 14px; font-size: 15px; border-radius: var(--r-md); }
.btn-icon { width: var(--tap); padding: 0; font-size: 20px; flex: none; }
.btn-icon.btn-sm { width: var(--tap-sm); }
.btn-block { width: 100%; }
.btn-label { cursor: pointer; }
.btn-between { justify-content: space-between; width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- 表單 ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: 15px; font-weight: 700; color: var(--text); }
.hint { font-size: 14px; color: var(--text-3); }
.input, .select, .textarea {
  width: 100%; min-height: var(--tap); padding: 0 14px;
  border: 1.5px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); font-size: 16px; line-height: 1.4;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { padding: 12px 14px; resize: vertical; min-height: 120px; }
.input::placeholder, .textarea::placeholder { color: var(--text-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-line); }
.select { appearance: none; padding-right: 40px; font-weight: 500;
  background-image: linear-gradient(45deg, transparent 50%, var(--text) 50%), linear-gradient(135deg, var(--text) 50%, transparent 50%);
  background-position: calc(100% - 21px) 50%, calc(100% - 15px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
.input-row { display: flex; gap: 8px; }
.input-row .input { flex: 1; min-width: 0; }

.switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 52px; height: 32px; margin: 0;
  border-radius: 99px; background: var(--surface-3); border: 2px solid var(--line-strong); cursor: pointer; transition: background .2s, border-color .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text-2); transition: transform .2s, background .2s; }
.switch:checked { background: var(--primary); border-color: var(--primary); }
.switch:checked::after { transform: translateX(20px); background: var(--on-primary); }
.switch:disabled { opacity: .45; }

.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--r-md); }
.seg button, .seg label { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.seg [aria-pressed="true"], .seg .is-on { background: var(--primary); color: var(--on-primary); font-weight: 700; }
.seg label input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:focus-within { outline: 3px solid var(--primary); outline-offset: 1px; }
.seg-full { display: flex; width: 100%; }
.seg-full > * { flex: 1; }
.seg-label { padding: 0 10px 0 12px; font-size: 14px; font-weight: 700; color: var(--text-3); display: flex; align-items: center; }

/* ---------- 標籤 ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 2px 12px; border-radius: 99px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 700; line-height: 1.3; white-space: nowrap; }
.chip-primary { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary-ink); }
.chip-danger { background: var(--danger-soft); border-color: var(--danger-line); color: var(--danger-ink); }
.chip-heavy { background: var(--inverse); border-color: var(--inverse); color: var(--on-inverse); }
.badge { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 6px; border: 1.5px solid var(--line-strong); color: var(--text-2); font-size: 14px; font-weight: 700; white-space: nowrap; }

/* 座號名牌：左側座號、右側姓名，黑白灰 */
.tag { display: inline-flex; align-items: stretch; min-height: 42px; border-radius: var(--r-sm); overflow: hidden; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--text); font-size: 17px; font-weight: 700; line-height: 1.2; }
.tag b { display: grid; place-items: center; min-width: 36px; padding: 0 8px; background: var(--surface-3); color: var(--text); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; border-right: 1.5px solid var(--line-strong); }
.tag > span { display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.tag i { font-style: normal; font-size: 14px; font-weight: 700; padding: 0 7px; border-radius: 5px; background: var(--inverse); color: var(--on-inverse); line-height: 22px; }
.tag-empty { background: transparent; border: 1.5px dashed var(--line-strong); color: var(--text-2); font-weight: 500; }
.tag-empty > span { padding: 0 14px; }
.tag-draw { background: var(--primary-soft); border: 1.5px dashed var(--primary); color: var(--primary-ink); }
.tag-draw > span { padding: 0 14px; }

/* ---------- 卡片 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.card-pad { padding: 16px; }
.card-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- 外框 ---------- */
.shell-side .content { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: var(--viewport-h, 100dvh); }
.shell-side { --dock-offset: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); }
.sidebar, .rail { display: none; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 6px var(--pad); background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--inverse); display: grid; place-items: center; font-size: 22px; }
.brand-text { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.brand-name { font-size: 17px; font-weight: 700; white-space: nowrap; }
.brand-sub { font-size: 14px; color: var(--text-3); white-space: nowrap; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.tabbar { position: sticky; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; min-height: var(--tabbar-h); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; border: 0; background: none; border-radius: var(--r-md); color: var(--text-2); font-size: 14px; font-weight: 500; }
.tab-ico { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 99px; font-size: 21px; line-height: 1; }
.tab[aria-current="page"] { color: var(--primary-ink); font-weight: 700; }
.tab[aria-current="page"] .tab-ico { background: var(--primary-soft); }

.nav-item { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 0; border-radius: var(--r-md); background: none; color: var(--text); font-size: 16px; font-weight: 500; text-align: left; width: 100%; }
.nav-item:hover { background: var(--surface-2); }
.nav-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); font-weight: 700; }
.nav-ico { font-size: 20px; line-height: 1; width: 26px; text-align: center; }

/* ---------- 主內容 ---------- */
.main { flex: 1; width: 100%; max-width: 1160px; margin-inline: auto; padding: 16px var(--pad) 24px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-title { font-size: 28px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* 概況：四個數字一排 */
.overview { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.ov-cell { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ov-label { font-size: 14px; font-weight: 700; color: var(--text-3); }
.ov-value { font-size: 30px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ov-unit { font-size: 15px; font-weight: 500; color: var(--text-2); }

/* 抽籤動作 */
.action { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-1); }
.action-title { font-size: 22px; font-weight: 700; line-height: 1.3; }
.action-note { margin-top: 4px; font-size: 15px; color: var(--text-2); }
.action-btns { display: flex; align-items: center; gap: 10px; }
.action-btns .btn-primary { min-width: 176px; }

/* 結果區 */
.results { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.results-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.results-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 22px; font-weight: 700; }
.export { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
.xbtn { flex-direction: column; gap: 2px; min-height: 64px; padding: 0 4px; font-size: 14px; }
.xbtn .xico { font-size: 20px; line-height: 1; }

.slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slot-rows { display: flex; flex-direction: column; gap: 8px; }

/* 版面 A：分配表（一列一個工作，像紙本點名表） */

/* 版面 B：卡片 */

.tcard-icon { font-size: 32px; line-height: 1; width: 40px; text-align: center; }

.tcard-desc { font-size: 14px; color: var(--text-3); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.exempt { padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }

/* 名單 */
.two-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }

.fold-body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }

.mrow { display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 4px 0 2px; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); min-width: 0; }

.check span { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; font-weight: 700; border: 2px solid var(--primary); background: var(--primary); color: var(--on-primary); }

.check-row { display: flex; align-items: center; gap: 12px; min-height: var(--tap); font-weight: 700; font-size: 16px; cursor: pointer; }

.tlist { display: flex; flex-direction: column; }

/* 歷史記錄 */
.hlist { display: flex; flex-direction: column; gap: 10px; }

.h-sub { font-size: 15px; color: var(--text-2); }

.hbody { padding: 16px; border-top: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; gap: 14px; }
.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.hres { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.hres-head > span:first-child { display: flex; align-items: center; gap: 6px; min-width: 0; }
.empty-state { padding: 48px 16px; text-align: center; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; align-items: center; font-size: 17px; }

/* 系統設定 */
.set-card { padding: 20px 16px; display: flex; flex-direction: column; gap: 28px; }

.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); }
.picker button { height: 48px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 22px; padding: 0; }
.picker button[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); box-shadow: 0 0 0 1.5px var(--primary); }
.maint { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); }
.maint-danger { border-color: var(--danger-line); background: var(--danger-soft); }

/* 彈窗：手機是從底部滑出的面板，iPad 以上置中 */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.modal { width: 100%; max-height: 90dvh; overflow: auto; background: var(--surface); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-2); padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; animation: sheetUp .22s ease-out; }
@keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes modalIn { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.modal-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

.modal-sub > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1; }
.pickrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: var(--tap); padding: 6px 14px; border: 1.5px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); text-align: left; font-size: 16px; font-weight: 500; width: 100%; min-width: 0; }
.pickrow:hover { background: var(--surface-2); }
.pickrow > span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pickrow > span > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickrow small { font-size: 14px; color: var(--text-2); flex: none; }
.pickrow[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink); font-weight: 700; }
.pickrow[aria-pressed="true"] small { color: var(--primary-ink); }
.pickrow[disabled] { opacity: .45; cursor: not-allowed; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; max-height: min(52dvh, 440px); overflow: auto; }
.icon-pick { padding: 8px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); }
.btn-icon-pick { width: 60px; padding: 0; font-size: 22px; flex: none; }

/* 提示訊息 */

.app-footer { padding: 24px var(--pad) 28px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 14px; display: flex; flex-direction: column; gap: 6px; text-align: center; align-items: center; }

/* 抽籤動畫（保留原本六種效果的動作） */
@keyframes slotShuffle { 0% { transform: translateY(-3px); opacity: .8; } 50% { transform: translateY(3px); opacity: 1; } 100% { transform: translateY(0); opacity: .8; } }

.anim-shuffle { animation: slotShuffle .12s infinite ease-in-out; }

/* ============ iPad 直向（≥768） ============ */
@container frame (min-width: 768px) {

      '<div class="kit-card"><div class="app"><h3 style="margin-bottom:12px">標籤與名牌</h3><div class="row"><span class="badge">教室</span><span class="chip chip-heavy">🔨 辛苦</span><span class="chip chip-primary">✓ 抽籤完成</span><span class="chip">待抽籤狀態</span><span class="chip chip-danger">缺少 2 人手</span></div>' +
      '<div class="row" style="margin-top:12px">' + tag(MEMBERS[6]) + tag(MEMBERS[11], true) + '<span class="tag tag-empty"><span>待抽籤</span></span><span class="tag tag-draw"><span>🎰 滾動中…</span></span></div></div></div>' +
      '<div class="kit-card"><div class="app"><h3 style="margin-bottom:12px">表單與開關</h3><div style="display:grid;gap:12px"><div class="field"><label class="label" for="k1">工作名稱</label><input class="input" id="k1" value="擦黑板"></div>' +
      '<div class="field"><label class="label" for="k2">動畫效果</label><select class="select" id="k2"><option>🎰 拉霸機姓名高速滾動</option></select></div>' +
      '<label class="check-row" style="justify-content:space-between"><span>⚡ 不重複模式</span><input class="switch" type="checkbox" checked></label>' +
      '<label class="check-row" style="justify-content:space-between"><span>🎉 抽籤完畢慶祝彩帶</span><input class="switch" type="checkbox"></label>' +
      '<div class="seg seg-full" role="group" aria-label="抽籤時長"><button type="button" aria-pressed="false">短 6 秒</button><button type="button" aria-pressed="true">中 12 秒</button><button type="button" aria-pressed="false">長 18 秒</button></div></div></div></div>' +
      '<div class="kit-card"><div class="app"><h3 style="margin-bottom:12px">工作列的三種狀態：待抽籤、完成、抽籤中</h3><div class="card roster">' + rosterRow(BOARD[5], { empty: true }) + rosterRow(BOARD[1]) + rosterRow(BOARD[6], { drawing: true }) + '</div></div></div>' +
      '<div class="kit-card"><div class="app"><h3 style="margin-bottom:12px">卡片的三種狀態</h3><div style="display:grid;gap:12px">' + card(BOARD[5], { empty: true }) + card(BOARD[1]) + card(BOARD[6], { drawing: true }) + '</div></div></div>' +
      '<div class="kit-card"><div class="app"><h3 style="margin-bottom:12px">提示訊息</h3><div class="row"><span class="toast">已成功儲存「擦黑板」修改內容！</span></div></div></div>';
  }

  function effective() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  var DEV = { phone: [390, 844, '手機 390 × 844'], pad: [820, 1180, 'iPad 直向 820 × 1180'], desk: [1280, 800, '桌機 1280 × 800'] };
  function fig(kind, html) {
    var d = DEV[kind];
    return '<figure class="dev"><figcaption>' + d[2] + '</figcaption><div class="fitbox" data-w="' + d[0] + '" data-h="' + d[1] + '"><div class="frame" style="width:' + d[0] + 'px;height:' + d[1] + 'px;--viewport-h:' + d[1] + 'px">' + html + '</div></div></figure>';
  }
  function wide(html) { return html.replace('data-open-on-wide', 'open'); }
  function render() {
    var a = shellSide('draw', drawMain('roster'));
    document.getElementById('g-3a').innerHTML = fig('desk', a) + fig('pad', a) + fig('phone', a);
    fit();
  }
  function fit() {
    document.querySelectorAll('.group').forEach(function (g) {
      var boxes = Array.prototype.slice.call(g.querySelectorAll('.fitbox'));
      var avail = g.clientWidth - 2, gap = 24;
      var sumW = boxes.reduce(function (a, b) { return a + (+b.dataset.w); }, 0);
      var s = Math.min(1, (avail - gap * (boxes.length - 1)) / sumW);
      var together = s >= 0.5;
      boxes.forEach(function (b) {
        var w = +b.dataset.w, h = +b.dataset.h;
        var sc = together ? s : Math.min(1, avail / w);
        b.style.width = Math.round(w * sc) + 'px'; b.style.height = Math.round(h * sc) + 'px';
        b.firstElementChild.style.transform = 'scale(' + sc + ')';
      });
    });
  }
  var root = document.documentElement;
  var btns = document.querySelectorAll('.themeseg button');
  function setTheme(v) {
    if (v === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', v);
    btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.set === v)); });
    render();
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { setTheme(b.dataset.set); }); });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  window.addEventListener('resize', fit);
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
